<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>sobosuba風パズル - ソフトボディ版</title>
    
    <!-- 【最重要】相対パスの解決先をGitHubのリポジトリルートへ固定 -->
    <base href="https://norion3.github.io/sobosuba/">
    
    <!-- UI構築用 Tailwind CSS (物理エンジン等のコアライブラリはJS内でESMとしてインポートします) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* =========================================================
           GRAVITY UI最適化規格: ラバーバンド現象の物理遮断
           ========================================================= */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050505;
            overflow: hidden;
            /* 画面外余白ドラッグによるOS背景露出を完全に遮断 */
            touch-action: none;
            overscroll-behavior: none;
            -webkit-overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        
        /* ※これ以下の #game-container 等の個別スタイルは dom_ui.js のインラインスタイル生成へ委譲したため削除 */
    </style>
</head>
<!-- 
  【重要設計変更】
  body内はスクリプト読み込みを除いて完全に空洞化しています。
  これにより dom_ui.js 内の mountDOM() が正しく作動し、
  ゲームコンテナ・Canvas・UIレイヤーのすべてがJSから動的に構築されます。
-->
<body>

<!-- メインロジックの読み込み (絶対パスによる完全ESModule呼び出し) -->
<!-- 物理エンジン(Matter.js)等はこのJS内部から esm.sh 経由でインポートされます -->
<script type="module" src="/sobosuba/main.js"></script>

</body>
</html>
